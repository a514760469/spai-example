server:
    port: 8800
spring:
    application:
        name: rag-my-knowledge
    ai:
        dashscope:
            api-key: ${AI_DASHSCOPE_API_KEY}
            chat:
                options:
                    model: qwen3.8-max
                    multi-model: true # qwen3.8-max 是多模态需要开启，qwen-max 则不用
            embedding:
                options:
                    model: qwen3.7-text-embedding
                    dimensions: 1536
            rerank:
                options:
                    model: qwen3.7-text-rerank
        vectorstore:
            pgvector:
                dimensions: 1536
                distance-type: cosine_distance
                index-type: hnsw
                initialize-schema: true
#                schema-validation: true
                max-document-batch-size: 10000
                table-name: knowledge_store_1536
    data:
        redis:
            password: 123456
            host: localhost
            database: 0
    datasource:
        url: jdbc:postgresql://localhost:5432/postgres
        username: postgres
        password: password
logging:
    level:
        org.springframework.jdbc.core.JdbcTemplate: debug
        org.springframework.ai: debug
        com.alibaba.dashscope.api: debug
        com.alibaba.cloud.ai.dashscope.chat: debug
        # request url debug
        org.springframework.web.client: debug
        org.apache.hc.client5.http: debug
