spring:
    datasource:
        url: jdbc:mysql://localhost:3307/spai?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: root
        password: 123456
    application:
        name: shopping-agent
    ai:
        dashscope:
            api-key: ${AI_DASHSCOPE_API_KEY}
            chat:
                options:
                    model: deepseek-v4.1-flash-1017
                    multi-model: true
            embedding:
                options:
                    model: qwen3.7-text-embedding-flash
                    dimensions: 1024
            rerank:
                options:
                    model: qwen3.7-text-rerank
                    # DashScopeRerankOptions.topN 默认 3
                    top-n: 5
        mcp:
            client:
                enabled: true
                toolcallback:
                    enabled: true
                sse:
                    connections:
                        ecom-mock:
                            url: "http://localhost:8000"
                            sse-endpoint: "/sse"
                request-timeout: 60s
        vectorstore:
            redis:
                initialize-schema: true
                index-name: product-idx
                prefix: "product:"
    data:
        redis:
            host: 127.0.0.1
            password: 123456
            port: 6379
server:
    servlet:
        encoding:
            force: true
            force-request: true
            force-response: true
    port: 8080

# Mock Platform Secret
shopping.mock.platform-secret: mock-platform-secret-key

# RAG 商品索引数据源（server REST，注意 0-based 分页）
product:
    base-url: http://localhost:8000

# 长期记忆抽取模型（使用flash模型）
memory:
    extract-model: qwen-flash

# 可观测：Prometheus 抓取端点（默认只暴露 health）
management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus
    metrics:
        tags:
            application: ${spring.application.name}

logging:
    level:
        org.springframework.jdbc.core.JdbcTemplate: debug
        org.springframework.ai: debug
        com.alibaba.dashscope.api: debug
        com.alibaba.cloud.ai.dashscope.chat: debug
        # request url debug
        org.springframework.web.client: debug
        org.apache.hc.client5.http: debug
        org.springframework.ai.chat.client.advisor: DEBUG
