server:
    port: 19001
spring:
    ai:
        mcp:
            server:
                name: ${spring.application.name}            # mcp-server mcp服务器名称
                protocol: streamable                        # 协议类型
                type: async
                instructions: "This server provides tools to read and search Nacos configuration items"
                request-timeout: 20s
                streamable-http:
                    disallow-delete: false
                    keep-alive-interval: 30s
                    mcp-endpoint: /mcp

        alibaba:
            mcp:
                nacos:
                    username: nacos
                    password: nacos
                    server-addr: 127.0.0.1:8848
                    namespace: public
                    register:
                        enabled: true
                        service-group: mcp-server
                        service-name: ${spring.application.name}
    application:
        name: mcp-nacos-server
logging:
    level:
        com.alibaba.cloud.ai.mcp.register.NacosMcpRegister: warn
