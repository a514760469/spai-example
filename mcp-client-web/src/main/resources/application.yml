server:
    port: 8080

spring:
    application:
        name: mcp-client-web
    ai:
        dashscope:
            api-key: ${AI_DASHSCOPE_API_KEY}
        alibaba:
            mcp:
                router:
                    enabled: true
                    discovery-order:
                        - file
                        - database
                        - nacos
                    # MCP file configuration
                    services:
                        - name: weather-service
                          description: "天气查询服务"
                          protocol: "http"
                          version: "1.0.0"
                          endpoint: "http://localhost:8080/weather"
                          enabled: true
                          tags:
                              - "weather"
                              - "api"
                        - name: translation-service
                          description: "翻译服务"
                          protocol: "http"
                          version: "2.0.0"
                          endpoint: "http://localhost:8081/translate"
                          enabled: true
                          tags:
                              - "translation"
                              - "nlp"
                    database:
                        enabled: true
                        url: jdbc:mysql://localhost:3340/testdb?useSSL=false
                        username: root
                        password: 123456
                        driver-class-name: com.mysql.cj.jdbc.Driver
                nacos:
                    server-addr: localhost:8848
                    namespace: public
