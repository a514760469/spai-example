spring:
    elasticsearch:
        uris: http://localhost:9200
    datasource:
        url: jdbc:mysql://localhost:3307/spai?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&tinyInt1isBit=false&allowLoadLocalInfile=true&allowLocalInfile=true&allowUrl
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: root
        password: 123456
    ai:
        vectorstore:
          elasticsearch:
              initialize-schema: true
              index-name: spai-index
              similarity: cosine
              dimensions: 1024
        dashscope:
            api-key: ${AI_DASHSCOPE_API_KEY}
            chat:
                options:
                    model: qwen3.8-max
                    multi-model: true
#                    http-headers:
#                        X-DashScope-DataInspection: '{"input":"disable","output":"disable"}'
            embedding:
                options:
                    model: qwen3.7-text-embedding-flash
                    dimensions: 1024
            rerank:
                options:
                    model: qwen3.7-text-rerank
        mcp:
            client:
                enabled: true
                toolcallback:
                    enabled: true
                streamable-http:
                    connections:
                       jina:
                           url: "https://mcp.jina.ai"
                           endpoint: "/sse"
    application:
        name: react-agent
server:
    servlet:
        encoding:
            force: true
            force-request: true
            force-response: true

logging:
    level:
        org.springframework.jdbc.core.JdbcTemplate: debug
        org.springframework.ai: debug
        com.alibaba.dashscope.api: debug
        com.alibaba.cloud.ai.dashscope.chat: debug
        # request url debug
        org.springframework.web.client: debug
        org.apache.hc.client5.http: debug
        org.springframework.ai.chat.client.advisor: DEBUG
